- name: configure user service
  hosts: backend
  become: yes
  tasks:
    - name: disable defult node js
      command: dnf module disable nodejs -y
    - name: enable node js 24
      command: dnf module enable nodejs:24 -y
    - name: install node js
      dnf:
        name: nodejs
        state: present
    - name: create system user
      user: 
        name: expense
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
    - name: remove existing app
      file:
        path: /app
        state: absent
    - name: remove zip file
      file: 
        path: /tmp/backend.tar.gz
        state: absent
    - name: create directory
      file: 
        path: /app
        state: directory
    - name: download zip
      get_url:
        url: "https://raw.githubusercontent.com/daws-92s/expense-documentation/refs/heads/main/artifacts/expense-backend-v5.tar.gz"
        dest: /tmp/backend.tar.gz
    - name: unzip
      unarchive:
        src: /tmp/backend.tar.gz
        dest: /app
        remote_src: yes
    - name: install dependencies
      community.general.npm:
        path: /app
        state: present
    - name: copy user service
      template: 
        src: user.service.j2
        dest: /etc/systemd/system/expense.service
    - name: daemon reload
      systemd:
        daemon-reload: true
    - name: start and enable user
      service:
        name: expense
        state: restarted
        enabled: yes    



