- name: configure Front end nginx server
  hosts: frontend
  become: yes
  tasks:
    - name: install nginx
      dnf:
        name: nginx
        state: present 
    - name: enable and start 
      service:
        name: nginx
        state: started
        enabled: yes
    - name: find files in usr share nginx html
      find:
        path: /usr/share/nginx/html/
        recursive: true
        hidden: true
        file_type: any
      register: html_content
    - name: print
      debug:
        msg: "{{ html_content }}"                 