- name: configure Front end nginx server
  hosts: frontend
  become: yes
  tasks:
    - name: install nginx
      dnf:
        name: nginx
        state: present 
    - name: enable and start 
      service:
        name: nginx
        state: started
        enabled: yes
    - name: find files in usr share nginx html
      find:
        path: /usr/share/nginx/html/
        recurse: yes
        hidden: yes
        file_type: any
      register: html_content       
    - name: delete all files 
      file:
        path: "{{ item.path }}"
        state: absent  
      loop: "{{ html_content.files }}" 
    - name: download app
      get_url:
        url: "https://raw.githubusercontent.com/daws-92s/expense-documentation/refs/heads/main/artifacts/expense-frontend-v5.tar.gz"
        dest: /tmp/frontend.zip
    - name: unzip file
      unarchive:
        src: /tmp/frontend.zip
        dest: /usr/share/nginx/html/
        remote_src: yes
    - name: copy configure
      template: 
        src: frontend.conf
        dest: /etc/nginx/default.d/frontend.conf
    - name: restart 
      service:
        name: nginx
        state: restarted    
